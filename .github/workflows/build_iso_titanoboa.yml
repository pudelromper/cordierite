# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Live ISOs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_b2:
        description: 'Upload ISOs to Backblaze B2'
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [testing]
    paths:
      - installer/**

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - cordierite
          - cordierite-deck
          - cordierite-nvidia
          - cordierite-nvidia-open
    steps:
      - name: Show disk space
        run: sudo df -h

      - name: Check if /mnt is there
        id: check_mnt
        run: |
          if sudo mountpoint /mnt; then
            echo "mnt_is_there=1" >>$GITHUB_OUTPUT
          else
            echo "mnt_is_there=0" >>$GITHUB_OUTPUT
          fi

      - name: Free Disk Space (Ubuntu)
        if: ${{ steps.check_mnt.outputs.mnt_is_there == '1' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Mount Container Storage BTRFS Loopback
        run: |
          sudo truncate -s 70G /mnt/podman-storage.img
          sudo mkfs.btrfs -f /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          sudo mount -o compress-force=zstd:2 /mnt/podman-storage.img /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Set Image Tag
        id: generate-tag
        shell: bash
        run: |
          TAG="stable"

          if [[ "${{ github.ref_name }}" == "testing" ]]; then
              TAG="testing"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set Flatpaks Directory Shortname
        id: generate-flatpak-dir-shortname
        shell: bash
        run: |
          FLATPAK_DIR_SHORTNAME="kde_flatpaks"

          if [[ "${{ matrix.image_name }}" =~ "gnome" ]]; then
            FLATPAK_DIR_SHORTNAME="gnome_flatpaks"
          fi

          echo "flatpak-dir-shortname=${FLATPAK_DIR_SHORTNAME}" >> $GITHUB_OUTPUT

      # Docker requires lowercase registry references
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # - name: Setup Bazzite Repo
      #   id: setup-bazzite-repo
      #   shell: bash
      #   run: |
      #     curl -Lo ${{ github.workspace }}/bazzite.repo https://copr.fedorainfracloud.org/coprs/ublue-os/bazzite/repo/fedora-${{ matrix.major_version }}/bazzite-org-bazzite-fedora-${{ matrix.major_version }}.repo

      # We need this as we use the desktop image as the runtime for
      # the livecds.
      - name: Obtain non-deck image ref
        id: get-nondeck-ref
        run: |
          ref="${{ matrix.image_name }}"
          ref="${ref/-deck/}"
          ref="${ref/-nvidia-open/}"
          ref="${ref/-nvidia/}"
          # Handle naming mismatch: deck uses nvidia-gnome, non-deck uses gnome-nvidia
          if [[ "$ref" == "bazzite-nvidia-gnome" ]]; then
            ref="bazzite-gnome-nvidia"
          fi
          echo "ref=${ref}" >> $GITHUB_OUTPUT

      - name: Build Container Image
        run: |
          BASE_IMAGE="${{ steps.registry_case.outputs.lowercase }}/${{ steps.get-nondeck-ref.outputs.ref }}:${{ steps.generate-tag.outputs.tag }}"
          INSTALL_IMAGE_PAYLOAD="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}:${{ steps.generate-tag.outputs.tag }}"
          FLATPAK_DIR_SHORTNAME="${{ steps.generate-flatpak-dir-shortname.outputs.flatpak-dir-shortname }}"

          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$INSTALL_IMAGE_PAYLOAD" \
            --build-arg FLATPAK_DIR_SHORTNAME="$FLATPAK_DIR_SHORTNAME" \
            -t localhost/payload:latest installer/

      - name: Build ISOs
        uses: Zeglius/titanoboa@revamp-pr
        id: build
        with:
          image-ref: localhost/payload:latest
          # TODO (@Zeglius): Remove "liveiso" prefix once this becomes the main ISO
          iso-dest: ${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}-live-amd64.iso
          hook-pre-initramfs: ${{ github.workspace }}/installer/titanoboa_hook_preinitramfs.sh
          hook-post-rootfs: ${{ github.workspace }}/installer/titanoboa_hook_postrootfs.sh

      - name: Move ISOs to Upload Directory
        id: upload-directory
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          ISO_NAME=$(basename ${{ steps.build.outputs.iso-dest }})
          DEST=${ISO_UPLOAD_DIR}/${ISO_NAME}

          mkdir -p ${ISO_UPLOAD_DIR}
          mv ${{ steps.build.outputs.iso-dest }} ${DEST}
          sha256sum ${DEST} > ${DEST}-CHECKSUM
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT
          echo "iso-name=${ISO_NAME}" >> $GITHUB_OUTPUT

      - name: Upload ISOs and Checksum to Job Artifacts
        if: github.ref_name == 'testing'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}
          path: ${{ steps.upload-directory.outputs.iso-upload-dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload ISO to Backblaze B2
        if: github.event_name == 'release' || inputs.upload_to_b2 == true
        uses: yamatt/backblaze-b2-upload-action@v7
        with:
          key_id: ${{ secrets.B2_KEY_ID }}
          application_key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket_name: ${{ secrets.B2_BUCKET_NAME }}
          file_path: ${{ steps.upload-directory.outputs.iso-upload-dir }}/${{ steps.upload-directory.outputs.iso-name }}
          remote_path: releases/${{ steps.generate-tag.outputs.tag }}/${{ steps.upload-directory.outputs.iso-name }}

      - name: Upload Checksum to Backblaze B2
        if: github.event_name == 'release' || inputs.upload_to_b2 == true
        uses: yamatt/backblaze-b2-upload-action@v7
        with:
          key_id: ${{ secrets.B2_KEY_ID }}
          application_key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket_name: ${{ secrets.B2_BUCKET_NAME }}
          file_path: ${{ steps.upload-directory.outputs.iso-upload-dir }}/${{ steps.upload-directory.outputs.iso-name }}-CHECKSUM
          remote_path: releases/${{ steps.generate-tag.outputs.tag }}/${{ steps.upload-directory.outputs.iso-name }}-CHECKSUM
